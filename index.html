<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee, ranked</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <p class="eyebrow">A personal index</p>
      <h1>Coffee, ranked</h1>
      <p class="lede">Every café I've been to, scored on what matters. Change the weights to rank them by what matters to <em>you</em>.</p>
    </header>

    <div class="layout">
      <main>
        <input class="search" id="search" type="search" placeholder="Search by name" aria-label="Search by name" autocomplete="off">
        <div class="list-head">
          <span class="eyebrow" id="list-meta"></span>
          <span class="eyebrow">Score</span>
        </div>
        <ol class="ranking" id="ranking"></ol>
      </main>

      <aside class="weights" id="weights">
        <details class="weights-box" id="weights-box" open>
          <summary>
            <span class="eyebrow">Weights</span>
            <span class="eyebrow active-preset" id="active-preset"></span>
          </summary>

          <section class="presets">
            <div class="preset-list" id="preset-list" role="radiogroup" aria-label="Presets"></div>
            <p class="preset-desc" id="preset-desc"></p>
          </section>

          <section id="category-controls"></section>
        </details>
      </aside>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
